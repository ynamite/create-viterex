name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # pnpm version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing (token-less publish + provenance auth) requires
      # npm >= 11.5.1; upgrade in case the runner's bundled npm is older.
      # npm 12 requires Node >= 22, hence node-version 24 above.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Determine dist-tag
        id: disttag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          case "$VERSION" in
            *-alpha*) TAG=alpha ;;
            *-beta*)  TAG=beta ;;
            *-rc*)    TAG=next ;;
            *)        TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "latest" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Dry-run smoke tests
        run: bash scripts/test-run.sh

      - name: npm publish (dry-run)
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run --access public --tag ${{ steps.disttag.outputs.tag }}

      - name: Dispatch summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "### Dry-run release validation"
            echo ""
            echo "- Version: \`$VERSION\`"
            echo "- Would publish to dist-tag: \`${{ steps.disttag.outputs.tag }}\`"
            echo "- No real publish or GitHub Release performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}

      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/notes.md
          {
            echo 'body<<NOTES_EOF'
            cat /tmp/notes.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.disttag.outputs.prerelease }}
